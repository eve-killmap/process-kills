logging:
  level: INFO
  max_bytes: 10485760
  backup_count: 5
  # file: process-kills.log

database:
  connect_max_retry_seconds: 60
  connect_retry_max_delay_seconds: 10

sources:
  r2z2_sequence_url: https://r2z2.zkillboard.com/ephemeral/sequence.json
  r2z2_ephemeral_url: https://r2z2.zkillboard.com/ephemeral/{sequence}.json
  esi_killmail_url: https://esi.evetech.net/killmails/{killmail_id}/{killmail_hash}/
  zkb_totals_url: https://r2z2.zkillboard.com/history/totals.json
  zkb_day_url: https://r2z2.zkillboard.com/history/{date}.json
  zkb_killmail_url: https://zkillboard.com/api/killID/{killmail_id}/

esi:
  rate_limit: 3600
  rate_limit_window: 900

live:
  poll_delay: 0.1
  retry_delay: 6.0

crosscheck:
  hour: 1

refresh:
  slow_refresh_hour: 11
  slow_refresh_minute: 0
  mv_refresh_interval_minutes: 360
  work_mem: 512MB

streaming:
  stream_name: kills:live
  stream_max_length: 1000
  discard_older_than: 7200
  invalidate_channel: cache:invalidate

metrics:
  enabled: false

entities:
  refresh_after_days: 30
  resolve_timeout: 10.0
  max_concurrency: 10
  backlog_interval: 60

wars:
  enabled: true
  interval: 60
  batch_size: 100

corporations:
  enabled: true
  interval: 60
  batch_size: 250
  max_concurrency: 10

factions:
  refresh_days: 7

facets:
  enabled: false

heartbeat:
  interval: 60
  downtime_hour: 11
  downtime_minutes: 20

leaderboard:
  enabled: true
  top_n: 25
  player_factions: [500001, 500002, 500003, 500004, 500010, 500011]
